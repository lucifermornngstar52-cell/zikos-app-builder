name: build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Приложение в ассеты
        run: |
          mkdir -p app/src/main/assets/app
          cp -r site/* app/src/main/assets/app/
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ZikApp-Android.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: ZikApp-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  exe:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать Electron
        shell: pwsh
        run: |
          curl.exe -sL -o el.zip https://github.com/electron/electron/releases/download/v33.2.0/electron-v33.2.0-win32-x64.zip
          if ((Get-Item el.zip).Length -lt 100MB) { throw "electron zip неполный: $((Get-Item el.zip).Length)" }
      - name: Упаковать приложение
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force elx | Out-Null
          tar -xf el.zip -C elx
          if (-not (Test-Path elx\electron.exe)) { throw 'electron.exe не найден после распаковки' }
          New-Item -ItemType Directory -Force -Path elx\resources\app | Out-Null
          Set-Content elx\resources\app\package.json '{"name":"zikapp","version":"1.0.0","main":"main.js"}'
          Set-Content elx\resources\app\main.js "const path=require('path');const e=require('electron');e.app.whenReady().then(()=>{const w=new e.BrowserWindow({width:1280,height:720,autoHideMenuBar:true});w.loadFile(path.join(__dirname,'app','index.html'));});"
          Copy-Item site elx\resources\app\app -Recurse -Force
          Remove-Item ZikApp-Windows-Portable.zip -ErrorAction SilentlyContinue
          tar -a -cf ZikApp-Windows-Portable.zip -C elx .
          if ((Get-Item ZikApp-Windows-Portable.zip).Length -lt 50MB) { throw "портативный zip слишком мал: $((Get-Item ZikApp-Windows-Portable.zip).Length)" }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: ZikApp-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
