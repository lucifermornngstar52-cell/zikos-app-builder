<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HikariOS Demo</title>
<style>
body { font-family: sans-serif; background: linear-gradient(135deg, #0f172a, #312e81); color: #e2e8f0; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin:0; }
.card { background: rgba(255,255,255,.06); padding: 32px 40px; border-radius: 16px; text-align: center; }
h1 { color: #93c5fd; margin: 0 0 8px; }
button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 10px; background: #3b82f6; color: white; font-size: 15px; }
p { margin: 6px 0; }
</style>
</head>
<body>
<div class="card">
<h1>Привет из HikariOS!</h1>
<p>Это живой предпросмотр HTML прямо на планшете.</p>
<button onclick="onClick()">Нажми меня</button>
<p id="out"></p>
</div>
<script>
function onClick() { document.getElementById("out").textContent = "JS работает! " + new Date().toLocaleTimeString(); }
</script>
</body>
</html>
